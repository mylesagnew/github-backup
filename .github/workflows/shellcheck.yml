name: ShellCheck & Bats

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions — this workflow only reads repo contents.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      # Pinned to a specific commit SHA for supply-chain safety.
      # To update: check https://github.com/actions/checkout/releases
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -o -name "*.bash" | sort | \
            xargs shellcheck \
              --severity=warning \
              --exclude=SC1091   # sourced paths resolved at runtime

  bats:
    name: Bats Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats git rsync

      - name: Run Bats test suite
        run: bats --print-output-on-failure tests/
